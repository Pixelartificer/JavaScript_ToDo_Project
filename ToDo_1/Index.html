<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Modern Name Picker</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="./Style.css" />
  </head>

  <body
    class="min-h-screen bg-gradient-to-br from-slate-950 via-indigo-950 to-purple-950 text-white"
  >
    <main class="flex min-h-screen items-center justify-center px-5 py-10">
      <div class="w-full max-w-5xl">
        <!-- =========================
             HEADER
        ========================== -->

        <div class="mb-10 text-center">
          <div
            class="mx-auto mb-5 flex h-14 w-14 items-center justify-center rounded-2xl border border-purple-400/30 bg-purple-500/10 text-2xl shadow-lg shadow-purple-500/20"
          >
            🎯
          </div>

          <h1 class="text-4xl font-extrabold tracking-tight md:text-6xl">
            NAME PICKER
          </h1>

          <p class="mt-3 text-sm text-slate-400 md:text-base">
            Let the random picker choose someone for you
          </p>
        </div>

        <!-- =========================
             MAIN CARD
        ========================== -->

        <div
          class="grid overflow-hidden rounded-3xl border border-white/10 bg-white/[0.04] shadow-2xl backdrop-blur-xl md:grid-cols-2"
        >
          <!-- =========================
               LEFT SIDE
          ========================== -->

          <div
            class="border-b border-white/10 p-6 md:border-b-0 md:border-r md:p-10"
          >
            <div class="mb-5 flex items-center justify-between">
              <div>
                <h2 class="text-lg font-bold">Enter Names</h2>

                <p class="mt-1 text-xs text-slate-500">One name per line</p>
              </div>

              <span
                id="nameCount"
                class="rounded-full border border-white/10 bg-white/5 px-3 py-1 text-xs font-semibold text-slate-400"
              >
                0 Names
              </span>
            </div>

            <!-- Name Input -->

            <textarea
              id="nameInput"
              rows="10"
              placeholder="Enter names here...

Aiden
Lawrence
James
Daniel
Michael
William"
              class="name-textarea w-full resize-none rounded-2xl border border-white/10 bg-black/20 p-5 text-sm text-white outline-none transition duration-300 placeholder:text-slate-600 focus:border-purple-400/60 focus:bg-black/30 focus:ring-2 focus:ring-purple-500/10"
            ></textarea>

            <!-- Error -->

            <p
              id="errorMessage"
              class="mt-3 hidden text-xs font-medium text-red-400"
            >
              Please enter at least one name.
            </p>

            <!-- Clear -->

            <button
              id="clearButton"
              class="mt-4 text-xs font-semibold text-slate-500 transition hover:text-white"
            >
              Clear All
            </button>
          </div>

          <!-- =========================
               RIGHT SIDE
          ========================== -->

          <div
            class="flex min-h-[450px] flex-col items-center justify-center p-6 md:p-10"
          >
            <p
              id="statusText"
              class="mb-8 text-xs font-semibold uppercase tracking-[0.3em] text-purple-300"
            >
              Ready to pick
            </p>

            <!-- =========================
                 PICKER DISPLAY
            ========================== -->

            <div
              id="pickerBox"
              class="picker-box relative flex h-56 w-full max-w-md items-center justify-center overflow-hidden rounded-3xl border border-white/10 bg-black/20 px-6"
            >
              <div class="picker-glow"></div>

              <span
                id="selectedName"
                class="relative z-10 text-center text-3xl font-extrabold text-white md:text-5xl"
              >
                ?
              </span>
            </div>

            <!-- =========================
                 BUTTON
            ========================== -->

            <button
              id="pickButton"
              class="mt-10 rounded-full bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 px-12 py-4 text-sm font-bold uppercase tracking-widest shadow-xl shadow-purple-500/30 transition duration-300 hover:scale-105 hover:shadow-purple-500/50 active:scale-95 disabled:cursor-not-allowed disabled:opacity-50"
            >
              🎲 Pick A Name
            </button>

            <p class="mt-5 text-center text-xs text-slate-600">
              The name will be selected randomly
            </p>
          </div>
        </div>

        <!-- =========================
             FOOTER
        ========================== -->

        <div class="mt-8 flex flex-wrap justify-center gap-8 text-center">
          <div>
            <p class="text-xs uppercase tracking-widest text-slate-600">
              Method
            </p>

            <p class="mt-1 text-sm font-semibold text-slate-400">Random</p>
          </div>

          <div>
            <p class="text-xs uppercase tracking-widest text-slate-600">
              Picker Speed
            </p>

            <p class="mt-1 text-sm font-semibold text-slate-400">80ms</p>
          </div>

          <div>
            <p class="text-xs uppercase tracking-widest text-slate-600">
              Result
            </p>

            <p class="mt-1 text-sm font-semibold text-slate-400">1 Winner</p>
          </div>
        </div>
      </div>
    </main>

    <!-- JavaScript -->
    <script src="./toDo_09.js"></script>
  </body>
</html>
