<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>টাইপিং ইফেক্ট</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
        .cursor {
            display: inline-block;
            width: 3px;
            background-color: #4f46e5;
            margin-left: 2px;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        .gradient-text {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-900 via-purple-900 to-pink-800 flex items-center justify-center p-4">
    
    <div class="max-w-4xl w-full">
        <!-- প্রধান কন্টেইনার -->
        <div class="bg-white/10 backdrop-blur-lg rounded-3xl p-8 md:p-12 shadow-2xl border border-white/20">
            
            <!-- শিরোনাম -->
            <h1 class="text-4xl md:text-5xl font-bold text-center mb-8 gradient-text">
                স্বাগতম
            </h1>
            
            <!-- টাইপিং ইফেক্ট কন্টেইনার -->
            <div class="bg-black/30 rounded-2xl p-6 md:p-8 mb-8">
                <div class="flex items-center justify-center min-h-[120px]">
                    <p id="typewriter-text" class="text-2xl md:text-3xl font-semibold text-white text-center leading-relaxed"></p>
                    <span class="cursor h-8 md:h-10"></span>
                </div>
            </div>
            
            <!-- নিয়ন্ত্রণ বাটন -->
            <div class="flex flex-wrap justify-center gap-4 mb-6">
                <button id="startBtn" class="px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl transition-all duration-300 transform hover:scale-105 shadow-lg">
                    শুরু করুন
                </button>
                <button id="pauseBtn" class="px-6 py-3 bg-yellow-600 hover:bg-yellow-700 text-white font-semibold rounded-xl transition-all duration-300 transform hover:scale-105 shadow-lg">
                    বিরতি
                </button>
                <button id="resetBtn" class="px-6 py-3 bg-red-600 hover:bg-red-700 text-white font-semibold rounded-xl transition-all duration-300 transform hover:scale-105 shadow-lg">
                    রিসেট
                </button>
            </div>
            
            <!-- স্পিড কন্ট্রোল -->
            <div class="flex flex-col items-center">
                <label for="speedRange" class="text-white text-lg mb-2">টাইপিং গতি: <span id="speedValue">100</span>ms</label>
                <input type="range" id="speedRange" min="50" max="300" value="100" 
                    class="w-64 h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
            </div>
            
        </div>
        
        <!-- বৈশিষ্ট্য কার্ড -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-8">
            <div class="bg-white/10 backdrop-blur-lg rounded-2xl p-6 border border-white/20">
                <h3 class="text-xl font-semibold text-white mb-3">🎯 বৈশিষ্ট্য ১</h3>
                <p class="text-gray-300">প্রতিটি অক্ষর ধাপে ধাপে প্রদর্শিত হয়</p>
            </div>
            <div class="bg-white/10 backdrop-blur-lg rounded-2xl p-6 border border-white/20">
                <h3 class="text-xl font-semibold text-white mb-3">⚡ বৈশিষ্ট্য ২</h3>
                <p class="text-gray-300">গতি নিয়ন্ত্রণ করা যায়</p>
            </div>
            <div class="bg-white/10 backdrop-blur-lg rounded-2xl p-6 border border-white/20">
                <h3 class="text-xl font-semibold text-white mb-3">🎨 বৈশিষ্ট্য ৩</h3>
                <p class="text-gray-300">সুন্দর গ্লাসমরফিজম ডিজাইন</p>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="./toDo_08.js"></script>
</body>
</html>
