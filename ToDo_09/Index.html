<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Typing Effect</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Momo+Signature&family=Monsieur+La+Doulaise&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Poppins", sans-serif;
      }

      @keyframes blink {
        0%,
        50% {
          opacity: 1;
        }

        51%,
        100% {
          opacity: 0;
        }
      }

      .cursor-blink {
        animation: blink 1s infinite;
      }
    </style>
  </head>

  <body
    class="min-h-screen bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-500 flex items-center justify-center p-4"
  >
    <div class="text-center">
      <!-- Main Text -->
      <p class="mb-4 text-4xl font-semibold text-white md:text-6xl">
        Hello, I'm Lawrence & I'm a
      </p>

      <!-- Typing Area -->
      <div class="flex h-24 items-center justify-center">
        <!-- Typed Text -->
        <p
          id="typewriter-text"
          class="text-5xl text-white md:text-7xl"
          style="font-family: &quot;Monsieur La Doulaise&quot;, cursive"
        ></p>

        <!-- Cursor -->
        <span
          class="cursor-blink ml-2 inline-block h-12 w-[3px] bg-white md:h-16"
        ></span>
      </div>
    </div>

    <!-- JavaScript -->
    <script src="./toDo_09.js"></script>
  </body>
</html>
