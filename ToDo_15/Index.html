<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Community Posts</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        position: relative;
        overflow-x: hidden;
        background:
          radial-gradient(
            circle at 5% 10%,
            rgba(14, 116, 144, 0.25),
            transparent 28%
          ),
          radial-gradient(
            circle at 95% 25%,
            rgba(16, 185, 129, 0.22),
            transparent 30%
          ),
          radial-gradient(
            circle at 20% 90%,
            rgba(14, 165, 233, 0.2),
            transparent 28%
          ),
          linear-gradient(
            135deg,
            #ecfeff 0%,
            #f0fdfa 45%,
            #eff6ff 100%
          );

        background-attachment: fixed;
      }

      body::before {
        content: "";
        position: fixed;
        width: 420px;
        height: 420px;
        left: -180px;
        top: -120px;
        border-radius: 50%;
        background: rgba(14, 116, 144, 0.3);
        filter: blur(80px);
        z-index: -20;
        pointer-events: none;
      }

      body::after {
        content: "";
        position: fixed;
        width: 480px;
        height: 480px;
        right: -200px;
        bottom: -150px;
        border-radius: 50%;
        background: rgba(16, 185, 129, 0.22);
        filter: blur(90px);
        z-index: -20;
        pointer-events: none;
      }

      /* HEADER */

      header {
        border-bottom: 1px solid rgba(255, 255, 255, 0.6) !important;

        background: linear-gradient(
          135deg,
          rgba(236, 253, 245, 0.85),
          rgba(224, 242, 254, 0.75)
        ) !important;

        backdrop-filter: blur(24px) saturate(160%);
        -webkit-backdrop-filter: blur(24px) saturate(160%);

        box-shadow:
          0 8px 35px rgba(13, 148, 136, 0.12),
          inset 0 1px 0 rgba(255, 255, 255, 0.8);
      }

      header > div {
        border-radius: 0 0 24px 24px;
      }

      /* CREATE POST */

      main > section:first-child {
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.72),
          rgba(240, 253, 250, 0.42)
        ) !important;

        border: 1px solid rgba(255, 255, 255, 0.75) !important;

        backdrop-filter: blur(28px) saturate(170%);
        -webkit-backdrop-filter: blur(28px) saturate(170%);

        box-shadow:
          0 25px 70px rgba(13, 148, 136, 0.12),
          0 8px 30px rgba(14, 165, 233, 0.08),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);

        position: relative;
      }

      main > section:first-child::after {
        content: "";
        position: absolute;
        width: 300px;
        height: 300px;
        right: -130px;
        top: -150px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.25);
        filter: blur(20px);
        pointer-events: none;
      }

      /* INPUTS */

      #nameInput,
      #postText,
      #searchInput {
        background: rgba(255, 255, 255, 0.55) !important;

        border: 1px solid rgba(255, 255, 255, 0.75) !important;

        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);

        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.8),
          0 5px 20px rgba(13, 148, 136, 0.05);

        color: #134e4a;
      }

      #nameInput::placeholder,
      #postText::placeholder,
      #searchInput::placeholder {
        color: rgba(71, 85, 105, 0.65);
      }

      #nameInput:focus,
      #postText:focus,
      #searchInput:focus {
        background: rgba(255, 255, 255, 0.8) !important;

        border-color: rgba(20, 184, 166, 0.75) !important;

        box-shadow:
          0 0 0 4px rgba(20, 184, 166, 0.12),
          0 10px 30px rgba(14, 165, 233, 0.1),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);
      }

      /* OPTION BUTTONS */

      #photoBtn,
      #videoBtn,
      #emojiBtn,
      #locationBtn,
      #linkBtn {
        position: relative;
        overflow: hidden;

        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.75),
          rgba(240, 253, 250, 0.45)
        ) !important;

        border: 1px solid rgba(255, 255, 255, 0.75) !important;

        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);

        box-shadow:
          0 8px 25px rgba(13, 148, 136, 0.08),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);

        transition:
          transform 0.3s ease,
          box-shadow 0.3s ease;
      }

      #photoBtn:hover,
      #videoBtn:hover,
      #emojiBtn:hover,
      #locationBtn:hover,
      #linkBtn:hover {
        transform: translateY(-3px);

        box-shadow:
          0 12px 30px rgba(13, 148, 136, 0.14),
          0 4px 15px rgba(14, 165, 233, 0.08);
      }

      /* POST BUTTON */

      #postBtn {
        position: relative;
        overflow: hidden;

        background: linear-gradient(
          100deg,
          #0f766e,
          #0891b2,
          #2563eb
        ) !important;

        border: 1px solid rgba(255, 255, 255, 0.5);

        box-shadow:
          0 12px 35px rgba(8, 145, 178, 0.28),
          inset 0 1px 0 rgba(255, 255, 255, 0.35);
      }

      #postBtn::before {
        content: "";
        position: absolute;
        top: 0;
        left: -120%;
        width: 70%;
        height: 100%;

        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.4),
          transparent
        );

        transform: skewX(-25deg);
        transition: left 0.7s ease;
      }

      #postBtn:hover::before {
        left: 140%;
      }

      /* RECENT POSTS */

      main > section:last-child {
        position: relative;
        padding: 22px;
        border-radius: 30px;

        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.6),
          rgba(240, 253, 250, 0.3)
        );

        border: 1px solid rgba(255, 255, 255, 0.75);

        backdrop-filter: blur(28px) saturate(170%);
        -webkit-backdrop-filter: blur(28px) saturate(170%);

        box-shadow:
          0 25px 70px rgba(13, 148, 136, 0.1),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);
      }

      #postsContainer {
        position: relative;
      }

      #postsContainer > * {
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.68),
          rgba(240, 253, 250, 0.35)
        ) !important;

        border: 1px solid rgba(255, 255, 255, 0.75) !important;

        backdrop-filter: blur(24px) saturate(165%);
        -webkit-backdrop-filter: blur(24px) saturate(165%);

        box-shadow:
          0 15px 40px rgba(13, 148, 136, 0.08),
          inset 0 1px 0 rgba(255, 255, 255, 0.85);

        transition:
          transform 0.3s ease,
          box-shadow 0.3s ease;
      }

      #postsContainer > *:hover {
        transform: translateY(-3px);

        box-shadow:
          0 20px 50px rgba(13, 148, 136, 0.13),
          inset 0 1px 0 rgba(255, 255, 255, 0.95);
      }

      /* EMPTY AREA */

      #postsContainer:empty::before {
        content: "✦";
        display: flex;
        align-items: center;
        justify-content: center;

        width: 100px;
        height: 100px;
        margin: 20px auto;

        border-radius: 50%;
        font-size: 42px;
        color: #0f766e;

        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.7),
          rgba(240, 253, 250, 0.35)
        );

        border: 1px solid rgba(255, 255, 255, 0.8);

        backdrop-filter: blur(20px);

        box-shadow:
          0 15px 40px rgba(13, 148, 136, 0.12),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);
      }

      /* POST COUNT */

      #postCount {
        background: linear-gradient(
          135deg,
          rgba(13, 148, 136, 0.9),
          rgba(14, 165, 233, 0.9)
        ) !important;

        color: white !important;

        border: 1px solid rgba(255, 255, 255, 0.45);

        backdrop-filter: blur(15px);

        box-shadow:
          0 8px 25px rgba(13, 148, 136, 0.2),
          inset 0 1px 0 rgba(255, 255, 255, 0.4);
      }

      @media (max-width: 640px) {
        main {
          padding-top: 24px !important;
        }

        main > section:last-child {
          padding: 16px;
          border-radius: 24px;
        }

        main > section:first-child {
          border-radius: 24px !important;
        }

        #photoBtn,
        #videoBtn,
        #emojiBtn,
        #locationBtn,
        #linkBtn {
          flex: 1 1 calc(50% - 8px);
        }
      }
    </style>
  </head>

  <body class="min-h-screen font-[Poppins] text-slate-800">

    <!-- Decorative Background -->
    <div class="pointer-events-none fixed inset-0 -z-10 overflow-hidden">
      <div
        class="absolute -left-32 -top-32 h-80 w-80 rounded-full bg-cyan-300/30 blur-3xl"
      ></div>

      <div
        class="absolute -bottom-32 -right-32 h-96 w-96 rounded-full bg-emerald-300/30 blur-3xl"
      ></div>

      <div
        class="absolute left-1/2 top-1/3 h-72 w-72 -translate-x-1/2 rounded-full bg-sky-200/20 blur-3xl"
      ></div>
    </div>

    <!-- Header -->
    <header class="sticky top-0 z-50">
      <div
        class="mx-auto flex max-w-4xl items-center justify-between px-4 py-4"
      >
        <div>
          <h1
            class="bg-gradient-to-r from-teal-600 via-cyan-600 to-blue-600 bg-clip-text text-xl font-bold text-transparent"
          >
            My Community
          </h1>

          <p class="text-xs text-slate-500">
            Share your thoughts
          </p>
        </div>

        <button
          type="button"
          class="flex h-11 w-11 items-center justify-center rounded-full border border-white/60 bg-gradient-to-br from-teal-100 to-sky-100 text-lg shadow-sm transition duration-300 hover:scale-105 hover:shadow-md"
        >
          🔔
        </button>
      </div>
    </header>

    <!-- Main -->
    <main class="mx-auto max-w-4xl px-4 py-8">

      <!-- Create Post -->
      <section
        class="relative overflow-hidden rounded-3xl p-5"
      >

        <!-- Top Gradient Line -->
        <div
          class="absolute left-0 right-0 top-0 h-1 bg-gradient-to-r from-teal-500 via-cyan-500 to-blue-500"
        ></div>

        <div class="mb-5 flex items-center gap-3">

          <div
            class="flex h-10 w-10 items-center justify-center rounded-xl bg-gradient-to-br from-teal-500 to-cyan-600 text-white shadow-lg"
          >
            ✨
          </div>

          <div>
            <h2 class="text-lg font-semibold text-slate-900">
              Create Post
            </h2>

            <p class="text-xs text-slate-500">
              Share something with the community
            </p>
          </div>

        </div>

        <!-- Name -->
        <input
          id="nameInput"
          type="text"
          placeholder="Your name"
          class="mb-4 w-full rounded-xl px-4 py-3 outline-none transition duration-300"
        />

        <!-- Post Text -->
        <textarea
          id="postText"
          rows="4"
          placeholder="What's on your mind?"
          class="w-full resize-none rounded-xl px-4 py-3 outline-none transition duration-300"
        ></textarea>

        <!-- File Preview -->
        <div
          id="filePreview"
          class="mt-3 hidden overflow-hidden rounded-xl border border-slate-200"
        ></div>

        <!-- Post Options -->
        <div class="mt-5 flex flex-wrap gap-2">

          <button
            id="photoBtn"
            type="button"
            class="rounded-xl px-4 py-2 text-sm font-medium text-teal-700 transition"
          >
            📷 Photo
          </button>

          <button
            id="videoBtn"
            type="button"
            class="rounded-xl px-4 py-2 text-sm font-medium text-cyan-700 transition"
          >
            🎥 Video
          </button>

          <button
            id="emojiBtn"
            type="button"
            class="rounded-xl px-4 py-2 text-sm font-medium text-sky-700 transition"
          >
            😊 Feeling
          </button>

          <button
            id="locationBtn"
            type="button"
            class="rounded-xl px-4 py-2 text-sm font-medium text-emerald-700 transition"
          >
            📍 Location
          </button>

          <button
            id="linkBtn"
            type="button"
            class="rounded-xl px-4 py-2 text-sm font-medium text-blue-700 transition"
          >
            🔗 Link
          </button>

        </div>

        <!-- Post Button -->
        <button
          id="postBtn"
          type="button"
          class="mt-5 w-full rounded-xl py-3 font-semibold text-white transition duration-300 hover:-translate-y-0.5 active:scale-[0.98]"
        >
          ✨ Post
        </button>

      </section>

      <!-- Recent Posts -->
      <section class="mt-10">

        <!-- SEARCH BAR -->
        <div
          class="mb-5 rounded-2xl border border-white/70 bg-white/70 p-3 shadow-sm backdrop-blur-xl"
        >
          <div class="flex items-center gap-3">

            <span class="text-lg">
              🔎
            </span>

            <input
              id="searchInput"
              type="text"
              placeholder="Search posts by name..."
              class="w-full rounded-xl bg-transparent py-2 px-2 text-sm outline-none placeholder:text-slate-400"
            />

          </div>
        </div>

        <div class="mb-5 flex items-center justify-between">

          <div>
            <h2 class="text-lg font-semibold text-slate-900">
              Recent Posts
            </h2>

            <p class="text-xs text-slate-500">
              Latest community activity
            </p>
          </div>

          <span
            id="postCount"
            class="rounded-full px-4 py-1.5 text-xs font-semibold shadow-sm"
          >
            0 Posts
          </span>

        </div>

        <!-- Posts -->
        <div
          id="postsContainer"
          class="space-y-5"
        ></div>

      </section>

    </main>

    <!-- JavaScript -->
    <script src="./toDo_09.js"></script>

  </body>
</html>
