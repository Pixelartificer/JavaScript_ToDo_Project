<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Nested Ternary Result Checker</title>

    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body
    class="min-h-screen bg-gradient-to-br from-slate-900 via-blue-900 to-indigo-900 flex items-center justify-center p-6"
  >
    <div class="w-full max-w-md">
      <div
        class="bg-white/10 backdrop-blur-xl border border-white/20 rounded-3xl p-8 shadow-2xl"
      >
        <!-- Header -->
        <div class="text-center mb-8">
          <div
            class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-blue-500/20 flex items-center justify-center text-3xl"
          >
            📊
          </div>

          <h1 class="text-3xl font-bold text-white">Result Checker</h1>

          <p class="text-slate-300 mt-2">
            Check your grade using nested ternary operators
          </p>
        </div>

        <!-- Input -->
        <div class="mb-5">
          <label class="block text-sm font-medium text-slate-200 mb-2">
            Enter your marks
          </label>

          <input
            id="marksInput"
            type="number"
            min="0"
            max="100"
            placeholder="Example: 85"
            class="w-full px-5 py-4 rounded-xl bg-white/10 border border-white/20 text-white placeholder-slate-400 outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-400/30 transition"
          />
        </div>

        <!-- Button -->
        <button
          id="checkBtn"
          class="w-full py-4 rounded-xl bg-blue-500 hover:bg-blue-600 active:scale-95 text-white font-semibold transition duration-200 shadow-lg shadow-blue-500/20"
        >
          Check Result
        </button>

        <!-- Result -->
        <div
          id="result"
          class="hidden mt-6 rounded-2xl bg-white/10 border border-white/10 p-5 text-center"
        >
          <p id="grade" class="text-4xl font-bold text-white"></p>

          <p id="message" class="mt-2 text-slate-300"></p>
        </div>
      </div>

      <p class="text-center text-slate-400 text-sm mt-5">
        5+ levels of nested ternary operators
      </p>
    </div>

    <script src="./toDo_09.js"></script>
  </body>
</html>
