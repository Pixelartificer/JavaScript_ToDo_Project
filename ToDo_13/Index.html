<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sorting Visualizer</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", sans-serif;
      }

      .bar {
        transition:
          height 0.35s ease,
          transform 0.35s ease,
          opacity 0.35s ease,
          filter 0.35s ease;
      }

      .bar.checking {
        transform: translateY(-10px) scale(1.04);
        filter: brightness(1.35);
      }

      .bar.swapping {
        transform: translateY(-16px) scale(1.08);
      }

      .bar.sorted {
        animation: sortedPulse 0.5s ease;
      }

      @keyframes sortedPulse {
        0% {
          transform: scale(1);
        }

        50% {
          transform: scale(1.08);
        }

        100% {
          transform: scale(1);
        }
      }

      .glass {
        background: rgba(255, 255, 255, 0.07);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border: 1px solid rgba(255, 255, 255, 0.12);
      }

      .grid-bg {
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.035) 1px,
            transparent 1px
          );

        background-size: 40px 40px;
      }

      .bar-gradient-1 {
        background: linear-gradient(180deg, #67e8f9, #0891b2);
      }

      .bar-gradient-2 {
        background: linear-gradient(180deg, #a78bfa, #7c3aed);
      }

      .bar-gradient-3 {
        background: linear-gradient(180deg, #f0abfc, #c026d3);
      }

      .bar-gradient-4 {
        background: linear-gradient(180deg, #fb7185, #e11d48);
      }

      .bar-gradient-5 {
        background: linear-gradient(180deg, #fbbf24, #d97706);
      }

      .bar-gradient-6 {
        background: linear-gradient(180deg, #4ade80, #16a34a);
      }

      .bar-gradient-7 {
        background: linear-gradient(180deg, #60a5fa, #2563eb);
      }

      .bar-gradient-8 {
        background: linear-gradient(180deg, #c084fc, #9333ea);
      }

      .bar-gradient-9 {
        background: linear-gradient(180deg, #2dd4bf, #0f766e);
      }

      .control-btn {
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease,
          opacity 0.2s ease;
      }

      .control-btn:hover:not(:disabled) {
        transform: translateY(-3px);
      }

      .control-btn:active:not(:disabled) {
        transform: translateY(0);
      }

      .control-btn:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }
    </style>
  </head>

  <body class="min-h-screen text-white bg-slate-950 overflow-x-hidden">
    <!-- Background -->
    <div class="fixed inset-0 -z-10 overflow-hidden">
      <div
        class="absolute -top-40 -left-40 w-96 h-96 rounded-full bg-cyan-500/20 blur-3xl"
      ></div>

      <div
        class="absolute top-1/3 -right-40 w-96 h-96 rounded-full bg-purple-500/20 blur-3xl"
      ></div>

      <div
        class="absolute -bottom-40 left-1/3 w-96 h-96 rounded-full bg-pink-500/10 blur-3xl"
      ></div>

      <div class="absolute inset-0 grid-bg"></div>
    </div>

    <!-- Main Container -->
    <main class="min-h-screen flex items-center justify-center px-4 py-10">
      <section class="w-full max-w-5xl">
        <!-- Header -->
        <div class="text-center mb-8">
          <div
            class="inline-flex items-center gap-2 px-4 py-2 mb-4 rounded-full glass text-sm text-slate-300"
          >
            <span
              class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"
            ></span>

            Sorting Visualizer
          </div>

          <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight">
            Sort The
            <span
              class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-purple-400 to-pink-400"
            >
              Numbers
            </span>
          </h1>

          <p class="mt-4 text-slate-400 max-w-xl mx-auto">
            Watch the bars compare and rearrange themselves from smallest to
            largest or largest to smallest.
          </p>
        </div>

        <!-- Visualizer Card -->
        <div class="glass rounded-3xl p-5 md:p-8 shadow-2xl">
          <!-- Top Info -->
          <div
            class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-8"
          >
            <div>
              <p class="text-xs uppercase tracking-[0.2em] text-slate-500">
                Current Order
              </p>

              <p
                id="orderDisplay"
                class="mt-1 text-lg font-semibold text-slate-200"
              >
                Random
              </p>
            </div>

            <div
              id="status"
              class="inline-flex items-center gap-2 self-start md:self-auto px-4 py-2 rounded-xl bg-white/5 border border-white/10 text-sm text-slate-300"
            >
              <span class="w-2 h-2 rounded-full bg-cyan-400"></span>

              Ready
            </div>
          </div>

          <!-- Chart -->
          <div
            id="barsContainer"
            class="h-[360px] md:h-[430px] flex items-end justify-center gap-2 sm:gap-3 md:gap-5 px-2 md:px-8 pb-10 border-b border-white/10"
          >
            <!-- Bars generated by JavaScript -->
          </div>

          <!-- Buttons -->
          <div class="mt-8 flex flex-col sm:flex-row justify-center gap-3">
            <button
              id="ascendingBtn"
              class="control-btn flex-1 sm:flex-none px-6 py-3.5 rounded-xl font-semibold bg-gradient-to-r from-cyan-500 to-blue-600 shadow-lg shadow-cyan-500/20"
            >
              ↑ Small to Large
            </button>

            <button
              id="descendingBtn"
              class="control-btn flex-1 sm:flex-none px-6 py-3.5 rounded-xl font-semibold bg-gradient-to-r from-purple-500 to-pink-600 shadow-lg shadow-purple-500/20"
            >
              ↓ Large to Small
            </button>

            <button
              id="resetBtn"
              class="control-btn flex-1 sm:flex-none px-6 py-3.5 rounded-xl font-semibold glass hover:bg-white/10"
            >
              ↻ Reset
            </button>
          </div>

          <!-- Legend -->
          <div
            class="mt-7 flex flex-wrap items-center justify-center gap-x-6 gap-y-3 text-xs text-slate-400"
          >
            <div class="flex items-center gap-2">
              <span class="w-2.5 h-2.5 rounded-full bg-cyan-400"></span>
              Comparing
            </div>

            <div class="flex items-center gap-2">
              <span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
              Sorted
            </div>

            <div class="flex items-center gap-2">
              <span class="w-2.5 h-2.5 rounded-full bg-purple-400"></span>
              Random
            </div>
          </div>
        </div>

        <!-- Footer -->
        <p class="text-center text-xs text-slate-600 mt-6">
          Built with HTML, Tailwind CSS & JavaScript
        </p>
      </section>
    </main>

    <script src="./toDo_09.js"></script>
  </body>
</html>
