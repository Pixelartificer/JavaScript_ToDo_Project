<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Community Posts</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- =========================
         GLASSMORPHISM UI
         No existing class/id changed
    ========================== -->
    <style>
      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        position: relative;
        overflow-x: hidden;

        background:
          radial-gradient(
            circle at 5% 10%,
            rgba(79, 70, 229, 0.38),
            transparent 28%
          ),
          radial-gradient(
            circle at 95% 25%,
            rgba(236, 72, 153, 0.32),
            transparent 30%
          ),
          radial-gradient(
            circle at 20% 90%,
            rgba(59, 130, 246, 0.3),
            transparent 28%
          ),
          radial-gradient(
            circle at 80% 85%,
            rgba(168, 85, 247, 0.28),
            transparent 30%
          ),
          linear-gradient(
            135deg,
            #dbeafe 0%,
            #eef2ff 35%,
            #fdf4ff 65%,
            #fce7f3 100%
          );

        background-attachment: fixed;
      }

      /* Large blurred background lights */
      body::before {
        content: "";
        position: fixed;
        width: 420px;
        height: 420px;
        left: -180px;
        top: -120px;
        border-radius: 50%;
        background: rgba(99, 102, 241, 0.42);
        filter: blur(80px);
        z-index: -20;
        pointer-events: none;
      }

      body::after {
        content: "";
        position: fixed;
        width: 480px;
        height: 480px;
        right: -200px;
        bottom: -150px;
        border-radius: 50%;
        background: rgba(217, 70, 239, 0.32);
        filter: blur(90px);
        z-index: -20;
        pointer-events: none;
      }

      /* =========================
         HEADER GLASS
      ========================== */

      header {
        border-bottom: 1px solid rgba(255, 255, 255, 0.55) !important;

        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.48),
          rgba(255, 255, 255, 0.2)
        ) !important;

        backdrop-filter: blur(24px) saturate(160%);
        -webkit-backdrop-filter: blur(24px) saturate(160%);

        box-shadow:
          0 8px 35px rgba(79, 70, 229, 0.12),
          inset 0 1px 0 rgba(255, 255, 255, 0.8);
      }

      header > div {
        border-radius: 0 0 24px 24px;
      }

      /* =========================
         CREATE POST GLASS
      ========================== */

      main > section:first-child {
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.62),
          rgba(255, 255, 255, 0.28)
        ) !important;

        border: 1px solid rgba(255, 255, 255, 0.72) !important;

        backdrop-filter: blur(28px) saturate(170%);
        -webkit-backdrop-filter: blur(28px) saturate(170%);

        box-shadow:
          0 25px 70px rgba(79, 70, 229, 0.13),
          0 8px 30px rgba(168, 85, 247, 0.08),
          inset 0 1px 0 rgba(255, 255, 255, 0.9),
          inset 0 -1px 0 rgba(255, 255, 255, 0.25);

        position: relative;
      }

      /* Glass shine */
      main > section:first-child::after {
        content: "";
        position: absolute;
        width: 300px;
        height: 300px;
        right: -130px;
        top: -150px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.2);
        filter: blur(20px);
        pointer-events: none;
      }

      /* =========================
         INPUT GLASS
      ========================== */

      #nameInput,
      #postText {
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.45),
          rgba(255, 255, 255, 0.18)
        ) !important;

        border: 1px solid rgba(255, 255, 255, 0.7) !important;

        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);

        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.8),
          0 5px 20px rgba(99, 102, 241, 0.05);

        color: #172554;
      }

      #nameInput::placeholder,
      #postText::placeholder {
        color: rgba(71, 85, 105, 0.65);
      }

      #nameInput:focus,
      #postText:focus {
        background: rgba(255, 255, 255, 0.58) !important;

        border-color: rgba(129, 140, 248, 0.75) !important;

        box-shadow:
          0 0 0 4px rgba(129, 140, 248, 0.12),
          0 10px 30px rgba(99, 102, 241, 0.1),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);
      }

      /* =========================
         OPTION BUTTONS
      ========================== */

      #photoBtn,
      #videoBtn,
      #emojiBtn,
      #locationBtn,
      #linkBtn {
        position: relative;
        overflow: hidden;

        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.65),
          rgba(255, 255, 255, 0.25)
        ) !important;

        border: 1px solid rgba(255, 255, 255, 0.72) !important;

        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);

        box-shadow:
          0 8px 25px rgba(79, 70, 229, 0.08),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);

        transition:
          transform 0.3s ease,
          box-shadow 0.3s ease,
          background 0.3s ease;
      }

      #photoBtn::before,
      #videoBtn::before,
      #emojiBtn::before,
      #locationBtn::before,
      #linkBtn::before {
        content: "";
        position: absolute;
        left: -100%;
        top: 0;
        width: 60%;
        height: 100%;

        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.45),
          transparent
        );

        transform: skewX(-20deg);
        transition: left 0.6s ease;
      }

      #photoBtn:hover::before,
      #videoBtn:hover::before,
      #emojiBtn:hover::before,
      #locationBtn:hover::before,
      #linkBtn:hover::before {
        left: 130%;
      }

      #photoBtn:hover,
      #videoBtn:hover,
      #emojiBtn:hover,
      #locationBtn:hover,
      #linkBtn:hover {
        transform: translateY(-3px);

        box-shadow:
          0 12px 30px rgba(99, 102, 241, 0.14),
          0 4px 15px rgba(236, 72, 153, 0.08),
          inset 0 1px 0 rgba(255, 255, 255, 1);
      }

      /* =========================
         POST BUTTON
      ========================== */

      #postBtn {
        position: relative;
        overflow: hidden;

        background: linear-gradient(
          100deg,
          rgba(79, 70, 229, 0.9),
          rgba(124, 58, 237, 0.92),
          rgba(236, 72, 153, 0.88)
        ) !important;

        border: 1px solid rgba(255, 255, 255, 0.5);

        box-shadow:
          0 12px 35px rgba(99, 102, 241, 0.3),
          0 4px 20px rgba(236, 72, 153, 0.16),
          inset 0 1px 0 rgba(255, 255, 255, 0.35);
      }

      #postBtn::before {
        content: "";
        position: absolute;
        top: 0;
        left: -120%;
        width: 70%;
        height: 100%;

        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.4),
          transparent
        );

        transform: skewX(-25deg);
        transition: left 0.7s ease;
      }

      #postBtn:hover::before {
        left: 140%;
      }

      /* =========================
         RECENT POSTS AREA
      ========================== */

      main > section:last-child {
        position: relative;

        padding: 22px;

        border-radius: 30px;

        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.52),
          rgba(255, 255, 255, 0.22)
        );

        border: 1px solid rgba(255, 255, 255, 0.7);

        backdrop-filter: blur(28px) saturate(170%);
        -webkit-backdrop-filter: blur(28px) saturate(170%);

        box-shadow:
          0 25px 70px rgba(79, 70, 229, 0.11),
          0 10px 35px rgba(217, 70, 239, 0.06),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);
      }

      /* =========================
         POST CONTAINER
      ========================== */

      #postsContainer {
        position: relative;
      }

      /* Every dynamically created post becomes glass */
      #postsContainer > * {
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.57),
          rgba(255, 255, 255, 0.23)
        ) !important;

        border: 1px solid rgba(255, 255, 255, 0.72) !important;

        backdrop-filter: blur(24px) saturate(165%);
        -webkit-backdrop-filter: blur(24px) saturate(165%);

        box-shadow:
          0 15px 40px rgba(79, 70, 229, 0.08),
          0 5px 20px rgba(236, 72, 153, 0.05),
          inset 0 1px 0 rgba(255, 255, 255, 0.85);

        transition:
          transform 0.3s ease,
          box-shadow 0.3s ease;
      }

      #postsContainer > *:hover {
        transform: translateY(-3px);

        box-shadow:
          0 20px 50px rgba(79, 70, 229, 0.13),
          0 8px 25px rgba(217, 70, 239, 0.08),
          inset 0 1px 0 rgba(255, 255, 255, 0.95);
      }

      /* =========================
         EMPTY POST AREA
      ========================== */

      #postsContainer:empty::before {
        content: "✦";
        display: flex;
        align-items: center;
        justify-content: center;

        width: 100px;
        height: 100px;
        margin: 20px auto;

        border-radius: 50%;

        font-size: 42px;

        color: #6366f1;

        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.65),
          rgba(255, 255, 255, 0.22)
        );

        border: 1px solid rgba(255, 255, 255, 0.75);

        backdrop-filter: blur(20px);

        box-shadow:
          0 15px 40px rgba(99, 102, 241, 0.12),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);
      }

      /* =========================
         POST COUNT
      ========================== */

      #postCount {
        background: linear-gradient(
          135deg,
          rgba(99, 102, 241, 0.8),
          rgba(168, 85, 247, 0.8)
        ) !important;

        color: white !important;

        border: 1px solid rgba(255, 255, 255, 0.45);

        backdrop-filter: blur(15px);

        box-shadow:
          0 8px 25px rgba(99, 102, 241, 0.2),
          inset 0 1px 0 rgba(255, 255, 255, 0.4);
      }

      /* =========================
         RESPONSIVE
      ========================== */

      @media (max-width: 640px) {
        main {
          padding-top: 24px !important;
        }

        main > section:last-child {
          padding: 16px;
          border-radius: 24px;
        }

        main > section:first-child {
          border-radius: 24px !important;
        }

        #photoBtn,
        #videoBtn,
        #emojiBtn,
        #locationBtn,
        #linkBtn {
          flex: 1 1 calc(50% - 8px);
        }
      }
    </style>
  </head>

  <body
    class="min-h-screen bg-gradient-to-br from-indigo-50 via-white to-purple-100 font-[Poppins] text-slate-800"
  >
    <!-- Decorative Background -->
    <div class="pointer-events-none fixed inset-0 -z-10 overflow-hidden">
      <div
        class="absolute -left-32 -top-32 h-80 w-80 rounded-full bg-purple-300/30 blur-3xl"
      ></div>

      <div
        class="absolute -bottom-32 -right-32 h-96 w-96 rounded-full bg-indigo-300/30 blur-3xl"
      ></div>

      <div
        class="absolute left-1/2 top-1/3 h-72 w-72 -translate-x-1/2 rounded-full bg-pink-200/20 blur-3xl"
      ></div>
    </div>

    <!-- Header -->
    <header
      class="sticky top-0 z-50 border-b border-white/50 bg-white/70 backdrop-blur-xl"
    >
      <div
        class="mx-auto flex max-w-4xl items-center justify-between px-4 py-4"
      >
        <div>
          <h1
            class="bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-500 bg-clip-text text-xl font-bold text-transparent"
          >
            My Community
          </h1>

          <p class="text-xs text-slate-500">Share your thoughts</p>
        </div>

        <button
          type="button"
          class="flex h-11 w-11 items-center justify-center rounded-full border border-white/60 bg-gradient-to-br from-indigo-100 to-purple-100 text-lg shadow-sm transition duration-300 hover:scale-105 hover:shadow-md"
        >
          🔔
        </button>
      </div>
    </header>

    <!-- Main -->
    <main class="mx-auto max-w-4xl px-4 py-8">
      <!-- Create Post -->
      <section
        class="relative overflow-hidden rounded-3xl border border-white/70 bg-white/80 p-5 shadow-xl shadow-indigo-100/50 backdrop-blur-xl"
      >
        <!-- Top Gradient Line -->
        <div
          class="absolute left-0 right-0 top-0 h-1 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500"
        ></div>

        <div class="mb-5 flex items-center gap-3">
          <div
            class="flex h-10 w-10 items-center justify-center rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 text-white shadow-lg shadow-indigo-200"
          >
            ✨
          </div>

          <div>
            <h2 class="text-lg font-semibold text-slate-900">Create Post</h2>

            <p class="text-xs text-slate-500">
              Share something with the community
            </p>
          </div>
        </div>

        <!-- Name -->
        <input
          id="nameInput"
          type="text"
          placeholder="Your name"
          class="mb-4 w-full rounded-xl border border-slate-200/80 bg-slate-50/80 px-4 py-3 outline-none transition duration-300 placeholder:text-slate-400 focus:border-indigo-400 focus:bg-white focus:ring-4 focus:ring-indigo-100"
        />

        <!-- Post Text -->
        <textarea
          id="postText"
          rows="4"
          placeholder="What's on your mind?"
          class="w-full resize-none rounded-xl border border-slate-200/80 bg-slate-50/80 px-4 py-3 outline-none transition duration-300 placeholder:text-slate-400 focus:border-purple-400 focus:bg-white focus:ring-4 focus:ring-purple-100"
        ></textarea>

        <!-- File Preview -->
        <div
          id="filePreview"
          class="mt-3 hidden overflow-hidden rounded-xl border border-slate-200"
        ></div>

        <!-- Post Options -->
        <div class="mt-5 flex flex-wrap gap-2">
          <button
            id="photoBtn"
            type="button"
            class="rounded-xl border border-indigo-100 bg-gradient-to-r from-indigo-50 to-blue-50 px-4 py-2 text-sm font-medium text-indigo-700 transition duration-300 hover:-translate-y-0.5 hover:from-indigo-100 hover:to-blue-100 hover:shadow-md"
          >
            📷 Photo
          </button>

          <button
            id="videoBtn"
            type="button"
            class="rounded-xl border border-purple-100 bg-gradient-to-r from-purple-50 to-fuchsia-50 px-4 py-2 text-sm font-medium text-purple-700 transition duration-300 hover:-translate-y-0.5 hover:from-purple-100 hover:to-fuchsia-100 hover:shadow-md"
          >
            🎥 Video
          </button>

          <button
            id="emojiBtn"
            type="button"
            class="rounded-xl border border-pink-100 bg-gradient-to-r from-pink-50 to-rose-50 px-4 py-2 text-sm font-medium text-pink-700 transition duration-300 hover:-translate-y-0.5 hover:from-pink-100 hover:to-rose-100 hover:shadow-md"
          >
            😊 Feeling
          </button>

          <button
            id="locationBtn"
            type="button"
            class="rounded-xl border border-emerald-100 bg-gradient-to-r from-emerald-50 to-teal-50 px-4 py-2 text-sm font-medium text-emerald-700 transition duration-300 hover:-translate-y-0.5 hover:from-emerald-100 hover:to-teal-100 hover:shadow-md"
          >
            📍 Location
          </button>

          <button
            id="linkBtn"
            type="button"
            class="rounded-xl border border-orange-100 bg-gradient-to-r from-orange-50 to-amber-50 px-4 py-2 text-sm font-medium text-orange-700 transition duration-300 hover:-translate-y-0.5 hover:from-orange-100 hover:to-amber-100 hover:shadow-md"
          >
            🔗 Link
          </button>
        </div>

        <!-- Post Button -->
        <button
          id="postBtn"
          type="button"
          class="mt-5 w-full rounded-xl bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-500 py-3 font-semibold text-white shadow-lg shadow-indigo-200 transition duration-300 hover:-translate-y-0.5 hover:shadow-xl hover:shadow-purple-200 active:scale-[0.98]"
        >
          ✨ Post
        </button>
      </section>

      <!-- Recent Posts -->
      <section class="mt-10">
        <div class="mb-5 flex items-center justify-between">
          <div>
            <h2 class="text-lg font-semibold text-slate-900">Recent Posts</h2>
            <p class="text-xs text-slate-500">Latest community activity</p>
          </div>
          <span
            id="postCount"
            class="rounded-full bg-gradient-to-r from-indigo-100 to-purple-100 px-4 py-1.5 text-xs font-semibold text-indigo-700 shadow-sm"
          >
            0 Posts
          </span>
        </div>

        <!-- Posts -->
        <div id="postsContainer" class="space-y-5"></div>
      </section>
    </main>

    <!-- JavaScript -->
    <script src="./toDo_09.js"></script>
  </body>
</html>
